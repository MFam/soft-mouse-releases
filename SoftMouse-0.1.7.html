<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font: 13px -apple-system"><h3>Soft Mouse 0.1.7</h3><ul><li>줄 단위로 스크롤하는 앱(Android Studio·IntelliJ 터미널 등)에서 휠 한 칸에 수십 줄이 움직이던 문제를 수정했습니다. 부드러운 스크롤 이벤트에 트랙패드와 같은 제스처 정보를 붙입니다.</li><li>새 <b>앱별 설정</b>: 앱마다 휠 스크롤 거리 배율을 정하거나 부드러운 스크롤을 끌 수 있습니다. Android Studio·IntelliJ가 설치되어 있으면 50% 규칙이 미리 추가됩니다.</li><li>부드러운 스크롤을 끈 상태에서 마우스 스크롤 반전이 동작하지 않던 문제를 수정했습니다.</li></ul></body></html>
